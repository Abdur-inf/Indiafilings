<!DOCTYPE html>
<html>
<head><title></title>
  <style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:1.5rem 1rem;max-width:720px;margin:0 auto}

h2{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.sub{font-size:13px;color:var(--color-text-secondary);margin-bottom:1.5rem}
.section{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:1rem}
.section-title{font-size:14px;font-weight:500;color:var(--color-text-secondary);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-row.one{grid-template-columns:1fr}
label{font-size:12px;color:var(--color-text-secondary);display:block;margin-bottom:4px}
input,select{width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);font-family:var(--font-sans)}
input:focus,select:focus{outline:none;border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,0.15)}
.member-block{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:1rem;margin-bottom:12px;position:relative}
.member-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.member-label{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.btn-remove{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:4px 10px;font-size:12px;color:var(--color-text-secondary);cursor:pointer}
.btn-remove:hover{background:var(--color-background-danger);color:var(--color-text-danger);border-color:var(--color-border-danger)}
.btn-add{background:none;border:0.5px dashed var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px;width:100%;font-size:13px;color:var(--color-text-secondary);cursor:pointer;margin-bottom:1rem}
.btn-add:hover{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.btn-submit{background:#185FA5;color:#fff;border:none;border-radius:var(--border-radius-md);padding:10px 28px;font-size:14px;font-weight:500;cursor:pointer;width:100%}
.btn-submit:hover{background:#0C447C}
.btn-submit:active{transform:scale(0.98)}
.btn-submit:disabled{background:#888;cursor:not-allowed}
.url-row{display:flex;gap:8px;margin-bottom:1rem}
.url-input{flex:1,border}
input,select{border: black solid 1px;border-radius: 5px;}
#response-box{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:1rem;font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;word-break:break-all;color:var(--color-text-primary);max-height:280px;overflow-y:auto;display:none;margin-top:1rem}
.status-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:8px;font-weight:500}
.badge-ok{background:var(--color-background-success);color:var(--color-text-success)}
.badge-err{background:var(--color-background-danger);color:var(--color-text-danger)}
.badge-load{background:var(--color-background-info);color:var(--color-text-info)}
button{background-color:#0C447C;border-radius: 5px;}
</style></head>
<body>
<div class="wrap" style="background-color: rgb(202, 247, 247);">
  <h2>PF New Onboarding</h2>
  <p class="sub">POST /pf_new_onboarding — configure your endpoint and members below</p>

  <div class="section">
    <div class="section-title"><i class="ti ti-server" aria-hidden="true"></i> Endpoint & credentials</div>

    <div class="form-row">
      <div><label>Username</label><input id="username" type="text" placeholder="username" /></div>
      <div><label>Password</label><input id="password" type="password" value="India123" /></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-users" aria-hidden="true"></i> Members <span id="member-count" style="font-size:12px;font-weight:400;color:var(--color-text-tertiary)">(2)</span></div>
    <div id="members-container"></div>
    <button class="btn-submit" onclick="addMember()"><i class="ti ti-plus" aria-hidden="true" ></i> Add member</button>
  </div>

      <div class="form-row one">
      <div><label>API URL</label><input id="api-url" type="text" value="http://127.0.0.1:5000/pf_new_onboarding" placeholder="http://..." /></div>
    </div>
    <br/>

  <button class="btn-submit" id="submit-btn" onclick="submitForm()">
    <i class="ti ti-send" aria-hidden="true"></i> Submit onboarding
  </button>

  <div id="response-box"></div>
</div>

<script>
const QUAL_OPTIONS=[
  {v:"",l:"— Select —"},
  {v:"1",l:"1 — Illiterate"},
  {v:"3",l:"3 — Non-matric"},
  {v:"4",l:"4 — Matric"},
  {v:"5",l:"5 — Senior secondary"},
  {v:"6",l:"6 — Graduate"},
  {v:"7",l:"7 — Post-graduate"},
  {v:"8",l:"8 — Doctorate"},
  {v:"9",l:"9 — Technical (professional)"},
];

const defaultMembers=[
  {uan_no:"",aadhar_no:"",aadhar_name:"",dob:"30/05/1996",qualification:"6",doj:"01/04/2026",wages:"15000",pan_number:"",pan_name:""},
];

let members=[...defaultMembers.map(m=>({...m}))];

function qualSelect(val,idx){
  return `<select onchange="updateMember(${idx},'qualification',this.value)">${QUAL_OPTIONS.map(o=>`<option value="${o.v}"${o.v===val?" selected":""}>${o.l}</option>`).join("")}</select>`;
}

function inp(idx,field,ph,val,type="text"){
  return `<input type="${type}" placeholder="${ph}" value="${val}" oninput="updateMember(${idx},'${field}',this.value)" />`;
}

function renderMembers(){
  const c=document.getElementById("members-container");
  c.innerHTML=members.map((m,i)=>`
    <div class="member-block">
      <div class="member-header">
        <span class="member-label"><i class="ti ti-user" aria-hidden="true"></i> Member ${i+1}</span>
        ${members.length>1?`<button class="btn-remove" onclick="removeMember(${i})"><i class="ti ti-trash" aria-hidden="true"></i> Remove</button>`:""}
      </div>
      <div class="form-row">${field("UAN No",inp(i,"uan_no","UAN number",m.uan_no))}${field("Aadhar No",inp(i,"aadhar_no","Aadhar number",m.aadhar_no))}</div>
      <div class="form-row">${field("Aadhar Name",inp(i,"aadhar_name","Name on Aadhar",m.aadhar_name))}${field("Date of Birth",inp(i,"dob","DD/MM/YYYY",m.dob))}</div>
      <div class="form-row">${field("Date of Joining",inp(i,"doj","DD/MM/YYYY",m.doj))}${field("Wages",inp(i,"wages","Monthly wages",m.wages))}</div>
      <div class="form-row">${field("Qualification",qualSelect(m.qualification,i))}${field("PAN Number",inp(i,"pan_number","PAN",m.pan_number))}</div>
      <div class="form-row one">${field("PAN Name",inp(i,"pan_name","Name on PAN",m.pan_name))}</div>
    </div>
  `).join("");
  document.getElementById("member-count").textContent=`(${members.length})`;
}

function field(label,ctrl){
  return `<div><label>${label}</label>${ctrl}</div>`;
}

function updateMember(idx,key,val){members[idx][key]=val}
function addMember(){members.push({uan_no:"",aadhar_no:"",aadhar_name:"",dob:"",qualification:"",doj:"",wages:"",pan_number:"",pan_name:""});renderMembers()}
function removeMember(idx){members.splice(idx,1);renderMembers()}

async function submitForm(){
  const url=document.getElementById("api-url").value.trim();
  const btn=document.getElementById("submit-btn");
  const box=document.getElementById("response-box");
  if(!url){alert("Please enter an API URL");return}
  const payload={
    username:document.getElementById("username").value,
    password:document.getElementById("password").value,
    members:members.map(m=>({...m}))
  };
  btn.disabled=true;
  btn.innerHTML='<i class="ti ti-loader" aria-hidden="true"></i> Submitting…';
  box.style.display="block";
  box.textContent="Sending request…\n\nPayload:\n"+JSON.stringify(payload,null,2);
  try{
    const res=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    let data;
    try{data=await res.json()}catch{data=await res.text()}
    const badge=res.ok?`<span class="status-badge badge-ok">✓ ${res.status}</span>`:`<span class="status-badge badge-err">✗ ${res.status}</span>`;
    btn.innerHTML=`<i class="ti ti-send" aria-hidden="true"></i> Submit onboarding ${badge}`;
    box.textContent="Status: "+res.status+" "+res.statusText+"\n\nResponse:\n"+(typeof data==="string"?data:JSON.stringify(data,null,2));
  }catch(e){
    btn.innerHTML='<i class="ti ti-send" aria-hidden="true"></i> Submit onboarding <span class="status-badge badge-err">✗ Error</span>';
    box.textContent="Request failed:\n"+e.message+"\n\nNote: If this is a localhost API, the request is blocked by the browser's cross-origin policy when running from an iframe. Run this from your local environment or use a CORS proxy.";
  }
  btn.disabled=false;
}

renderMembers();
</script>
</body>
</html>
